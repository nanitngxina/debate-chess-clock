name = "debate-cage-clock"
main = "worker-index.ts"
compatibility_date = "2026-03-18"
compatibility_flags = ["enable_request_signal"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[kv_namespaces]]
binding = "ROOM_DIRECTORY"

# 账号数据（账号、会话、验证码）存 D1，与房间用的 KV 分开
# 本地开发：npx wrangler d1 migrations apply DB --local
# 部署前：npx wrangler d1 create debate-cage-clock-accounts
#        然后把下面 database_id 换成创建出来的真实 id
[[d1_databases]]
binding = "DB"
database_name = "debate-cage-clock-accounts"
database_id = "local-dev-placeholder"
migrations_dir = "migrations"

# 头像图片（账号里只存 URL，不存 data URL）
# 本地开发：wrangler dev --local 自动模拟，不需要创建 bucket
# 部署前：npx wrangler r2 bucket create debate-cage-clock-avatars
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "debate-cage-clock-avatars"

[[migrations]]
tag = "v1"
new_classes = ["RoomDurableObject"]

