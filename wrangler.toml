name = "debate-cage-clock"
main = "worker-index.ts"
compatibility_date = "2026-03-18"
compatibility_flags = ["enable_request_signal"]

# 前端静态资源（先 npm run build 生成 dist/，再 deploy）
[assets]
directory = "./dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

# 房间目录（KV）
# 本地开发用不到真实 id（wrangler dev --local 会模拟）；
# 线上这个 id 是 2026-09-23 用 npx wrangler kv namespace create ROOM_DIRECTORY 创建的
[[kv_namespaces]]
binding = "ROOM_DIRECTORY"
id = "d87949ec50ed49f6b4eedf3dabb9289a"

# 账号数据（账号、会话、验证码、限流、发信记录）存 D1
# 建表：npx wrangler d1 migrations apply DB --remote
[[d1_databases]]
binding = "DB"
database_name = "debate-cage-clock-accounts"
database_id = "68948f4c-d306-447f-942f-2b5e47eb4599"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# 头像存储 —— 两种后端，代码会自动选（优先级 R2 > KV）
# ---------------------------------------------------------------------------
# 【后端一：KV】当前生效。免费、不需要绑支付方式，立即可用。
# 头像对象很小（≤1MB）且 key 唯一，KV 完全够用；免费额度 1GB / 10 万次读 / 1000 次写每天。
[[kv_namespaces]]
binding = "AVATAR_OBJECTS"
id = "92f5ace1710245669bff239ab17ec265"

# 【后端二：R2】未启用 —— 绑定先注释掉。
# 尝试创建 bucket 时 Cloudflare 返回：
#   Please enable R2 through the Cloudflare Dashboard. [code: 10042]
# 也就是必须先到网页后台手动开通一次 R2，而且**开通时要求账上有支付方式**
# （免费额度 10GB 照样要绑卡）。这一步 API 做不了，只能人来点。
#
# 想启用时：到后台开通 R2 → 创建 bucket `debate-cage-clock-avatars`
# → 取消下面三行注释 → 重新 deploy。**代码一行都不用改**，R2 会自动接管，
# 已有的 KV 头像也仍然读得到（读路径两个后端都会查）。
# [[r2_buckets]]
# binding = "AVATARS"
# bucket_name = "debate-cage-clock-avatars"

# 两个后端都没有时：头像上传接口返回 503，其余功能（房间、计时、语音、弹幕、
# 注册登录）完全不受影响 —— 代码对"没有任何头像后端"是显式支持的。

# Durable Object 迁移
# 用 SQLite 版（new_sqlite_classes）而不是 KV 版（new_classes）：
# · SQLite 版在 Workers 免费版上就能用，KV 版历来需要付费版
# · 本项目的房间对象只用 get/put/delete/setAlarm 这套 KV 风格 API，
#   SQLite 版 DO 完整支持，所以不需要改代码
# 注意：DO 一旦创建，存储后端就不能再改，所以必须在首次部署前定下来。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]
